
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziyan Ma | Creative Coding</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
  <script src="sketch.js" defer></script>

  <style>
    body {
      margin: 0;
      padding: 50px;
      min-height: 100vh;
      box-sizing: border-box;
      background-color: hsl(180, 25%, 78%);
      font-family: Arial, sans-serif;
      color: #333;
      transition: background-color 0.15s ease;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 10px;
    }

    p {
      color: #282828;
      line-height: 2;
    }

    h2 {
      margin-top: 60px;
      font-size: 22px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin-top: 25px;
    }


    .project {
      display: block;
      background-color: rgba(255, 255, 255, 0.65);
      padding: 60px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      text-decoration: none;
      color: #ad1414;
      font-weight: 600;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background-color 0.3s ease;
    }

    .project h3 {
      font-size: 25px;
      font-weight: 700;
      margin: 0 0 30px;
    }

    .project p {
      margin: 0;
    }

    @media (max-width: 700px) {
      body {
        padding: 25px;
      }

      .projects {
        grid-template-columns: 1fr;
      }

      .project {
        padding: 35px;
      }
    }
  </style>
</head>

<body>

  <h1>Ziyan Ma</h1>

  <p>Creative Coding — Fall 2026</p>

  <h2>My Projects</h2>

  <div class="projects">

      <h3>Week 01</h3>
      <p>View Project →</p>
    </a>

    <a class="project" href="week4/">

    <a class="project" href="week5/">

    </a>

    <a class="project" href="week6/">
      <h3>Week 06</h3>
      <p>View Project →</p>
    </a>

  </div>

</body>
</html>
